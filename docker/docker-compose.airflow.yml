version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: partintel_airflow_secret
    ES_HOST: host.docker.internal
    ES_PORT: "9200"
    ES_USER: elastic
    ES_PASSWORD: Daiz@2703
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ../collectors:/opt/airflow/collectors
    - ../scripts:/opt/airflow/scripts
    - ../data:/opt/airflow/data
    - ../ml:/opt/airflow/ml
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:15-alpine
    container_name: partintel_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    container_name: partintel_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: partintel_airflow_scheduler
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
