name: PartIntel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting deps
        run: pip install ruff==0.3.0

      - name: Ruff check
        run: ruff check api/ collectors/ ml/ --ignore E501,F401

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          ELASTIC_PASSWORD: "changeme123"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s -u elastic:changeme123 http://localhost:9200/_cluster/health"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn elasticsearch pandas \
                      feedparser requests gensim scikit-learn \
                      sentence-transformers bcrypt python-jose \
                      prometheus-client python-multipart httpx pytest pytest-cov

      - name: Wait for Elasticsearch
        run: |
          timeout 60 bash -c \
            'until curl -s -u elastic:changeme123 http://localhost:9200/_cluster/health; \
             do sleep 3; done'

      - name: Run tests with coverage
        env:
          ES_HOST: localhost
          ES_PORT: "9200"
          ES_USER: elastic
          ES_PASSWORD: changeme123
          JWT_SECRET_KEY: test_secret_key_minimum_32_characters_long
        run: |
          pytest api/tests/test_api.py \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt .
tail -3 .github/workflows/ci.yml
tail -3 requirements.txt
